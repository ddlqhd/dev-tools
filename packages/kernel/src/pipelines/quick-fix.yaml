version: 1
pipeline: quick-fix

nodes:
  code:
    type: agent
    engine: coder
    promptTemplate: code
  codeReview:
    type: review
    engine: codeReviewer
    severityGate: major
    outputs: [reviewComments]
  fixReview:
    type: agent
    engine: fixer
    inputs: [reviewComments]
    promptTemplate: fix
  verify:
    type: command
    run: ["pnpm lint", "pnpm test"]
    onFail:
      goto: reviewLoop
      asComment: blocker
  commit:
    type: commit
    messageStyle: conventional

flow:
  - code
  - loop:
      id: reviewLoop
      maxIterations: 5
      body: [codeReview, fixReview]
      until: codeReview.passed
  - verify:
      onFail:
        goto: reviewLoop
        asComment: blocker
  - commit
