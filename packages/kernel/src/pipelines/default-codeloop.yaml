version: 1
pipeline: default-codeloop

nodes:
  plan:
    type: agent
    engine: planner
    readonly: true
    promptTemplate: plan
    outputs: [planDoc]
  planReview:
    type: review
    engine: planReviewer
    inputs: [planDoc]
    outputs: [planComments]
    severityGate: major
  planGate:
    type: gate
    timeout: 24h
  code:
    type: agent
    engine: coder
    inputs: [planDoc]
    promptTemplate: code
  codeReview:
    type: review
    engine: codeReviewer
    severityGate: major
    outputs: [reviewComments]
  fixReview:
    type: agent
    engine: fixer
    inputs: [reviewComments]
    promptTemplate: fix
  verify:
    type: command
    run: ["pnpm lint", "pnpm test"]
    # Also accepted on the node; flow-step form below is the canonical wiring.
    onFail:
      goto: reviewLoop
      asComment: blocker
  commit:
    type: commit
    messageStyle: conventional

flow:
  - loop:
      id: planLoop
      maxIterations: 3
      body: [plan, planReview]
      until: planReview.passed
  - planGate
  - code
  - loop:
      id: reviewLoop
      maxIterations: 5
      body: [codeReview, fixReview]
      until: codeReview.passed
  - verify:
      onFail:
        goto: reviewLoop
        asComment: blocker
  - commit
